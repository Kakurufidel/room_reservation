{% extends 'base.html' %}
{% load i18n %}

{% block content %}
  <div class="container py-5" style="margin-top: 80px;">
    <h1 class="text-center mb-4">{% trans "Modifier la salle" %}</h1>

    <div class="d-flex justify-content-center">
      <div class="col-md-8 col-lg-6">
        <!-- Affichage de l'image actuelle -->
        {% if form.instance.image_room %}
          <div class="text-center mb-4">
            <img src="{{ form.instance.image_room.url }}" alt="{% trans 'Image de la salle' %}"
                 class="img-fluid rounded" style="max-width: 100%; height: auto;">
          </div>
        {% endif %}

        <!-- Formulaire -->
        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
          {% csrf_token %}
          {{ form.as_p }}

          <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary w-100 me-2">{% trans "Sauvegarder" %}</button>
            <a href="{% url 'list_rooms' %}" class="btn btn-secondary w-100">{% trans "Annuler" %}</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
